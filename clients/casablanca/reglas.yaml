# Reglas ejecutables de PISOS CASABLANCA.
#
# Esto es el feedback real convertido en compuertas. Antes vivía en cuatro lugares a
# la vez —marca.json → reglas_duras, prosa en CLAUDE.md, feedback/*.md y constantes
# hardcodeadas dentro de cuatro scripts de QA distintos— y por eso se aplicaba "si
# alguien se acordaba". Acá se aplica siempre.
#
# ⚠️ Estas reglas son DE ESTA MARCA. No se copian a otra.
#    Quien firma acá es Paulina Bustamante, diseñadora del cliente Grupo Revex
#    (EBEMA · Revex · Casablanca). Su criterio NO vale para Hilton (firma Elisabet
#    Soto), ni para Selfie (firma Constanza Lizana), ni para ninguna marca futura.
#    Cada marca levanta el suyo con su propia diseñadora.
#
# Toda regla lleva `autor` y `cita` verbatim: si nadie la pidió con esas palabras,
# no es una regla, es una opinión — y el motor la rechaza.

marca: casablanca
nombre: Pisos Casablanca by Grupo Revex
version: 1
actualizado: 2026-08-27

autoridad:
  - quien: Paulina Bustamante
    rol: diseñadora del cliente
    alcance: [ebema, revex, casablanca]
    canal: comentarios en los archivos del Drive
  - quien: Dirección de área
    rol: revisión interna Copylab
    alcance: [casablanca]
  - quien: Valeria Traverso
    rol: decisión final de marca
    alcance: [casablanca]

# ── ajustes a reglas de agencia ───────────────────────────────────────────────
ajustes:
  zona-segura-meta:
    porque: >-
      La tarjeta del logo cuelga del borde superior (top:0) en feed y en story. Es
      gramática medida de Paulina en las 55 piezas, ratificada dos veces por Valeria
      ("los logos deben quedar arriba, no al medio volando"), y en la ronda 2 Paulina
      no pidió despegarla sino achicarla. La zona segura protege el texto, no el logo.
    args:
      excepciones:
        - {x0: 0.36, y0: 0.0, x1: 0.64, y1: 0.17}

  respiro-borde:
    porque: >-
      Misma excepción: la placa del logo toca el borde superior por diseño.
    args:
      excepciones:
        - {x0: 0.36, y0: 0.0, x1: 0.64, y1: 0.17}

# ── reglas propias ────────────────────────────────────────────────────────────
reglas:

  - id: sin-rojo-revex
    titulo: El rojo de Revex no existe en Casablanca
    check: color_prohibido
    severidad: bloqueante
    autor: Valeria Traverso / marca.json → reglas_duras
    fecha: 2026-08-26
    cita: Jamás el rojo ni el esqueleto de Revex.
    porque: >-
      Casablanca y Revex son del mismo dueño con lenguajes OPUESTOS: acá no existe el
      rojo, ni el descuento, ni la urgencia. Un rojo saturado en una pieza de
      Casablanca no es una decisión de color: es la prueba de que se contaminaron dos
      marcas. Esta es la comprobación anti-mareo de la marca.
    args:
      # Los HEX reales de Revex, sacados de src/brand/revex.ts. Se prohíbe ESTE rojo,
      # no "el rojo": la madera de un roble tropical es rojiza y es el producto.
      colores: ["#D31A2B", "#D31418", "#CB1725", "#D3152B", "#D92028", "#AD1C27", "#9E1420"]
      delta_e: 22.0
      solo_plano: true
      max_fraccion: 0.002

  # ⛔ REGLA RETIRADA — paleta cerrada al gris #626260.
  #
  # La regla de marca es cierta (el gris es único y está medido en las 55 piezas),
  # pero la comprobación no la sabe verificar. Medido con qa/calibrar.py:
  #
  #   tinta plana fuera de paleta   aprobadas 0,00–0,99   ·   rechazadas 0,13–0,94
  #
  # Ni siquiera filtrando por varianza local se logra separar la caja gris de la
  # diseñadora de una zona lisa de la fotografía de ambiente — y la foto contiene
  # grises legítimos por todas partes. Marcaba hasta el 99 % de piezas perfectas.
  #
  # El gris sigue siendo dato de marca en marca.json y se respeta al PRODUCIR
  # (el sistema lo toma de ahí). Lo que no se puede es verificarlo sobre el PNG.

  - id: sin-urgencia
    titulo: Sin precios, descuentos ni urgencia
    check: texto_prohibido
    severidad: bloqueante
    autor: marca.json → reglas_duras
    fecha: 2026-08-26
    cita: Sin urgencia, sin descuento, sin precios, sin sellos de oferta.
    porque: >-
      Casablanca es la marca premium del grupo; Revex es la del descuento. Un "%" o un
      "desde $" acá es exactamente la mezcla de marcas que hay que impedir.
    args:
      patron: '(\$\s?\d|desde\s+\$|\d+\s*%\s*(off|dcto|descuento)?|oferta|descuento|liquidaci|remate|última\s+oportunidad|ultima\s+oportunidad)'

  - id: grafia-cumaru
    titulo: Se escribe «Cumarú»
    check: grafia_fijada
    severidad: bloqueante
    autor: Valeria Traverso
    fecha: 2026-08-25
    cita: >-
      Valeria confirmó que va Cumarú, que es lo que ya dice la pieza. El "Camarú UV"
      del sitio es un error del sitio, y el "CUMARU" del brief es sólo la mayúscula de
      una planilla.
    porque: >-
      Había tres grafías dando vueltas al mismo tiempo. Sin fijarla, la próxima
      persona vuelve a elegir y el nombre del producto baila entre piezas.
    args:
      correcta: "Cumarú"
      incorrectas: ["Camarú", "Camaru"]

  - id: sin-huerfanas
    titulo: Palabra sola en la última línea
    check: palabra_huerfana
    severidad: aviso
    autor: Paulina Bustamante
    fecha: 2026-08-25
    cita: no dejar palabras solas en la segunda linea de texto
    porque: >-
      Comentario sobre cb_sep_c1-aserrado_feed.png. Los saltos de línea de esta marca
      se fijan a mano justamente por esto.
    args: {}

  - id: muestra-igual-al-piso
    titulo: La muestra tiene que ser el mismo piso que está en el suelo
    check: coincide_color_entre_zonas
    severidad: bloqueante
    formato: feed
    solo_archivos: ["*c1-*"]
    autor: Dirección de área
    fecha: 2026-08-25
    cita: >-
      En las cuatro tarjetas el recuadro muestra un roble cálido de veta marcada, y el
      piso instalado es otro: claro, grisáceo y con nudos. Estamos mostrando un
      producto en la etiqueta y otro en el suelo. Para una marca de pisos ese es el
      error más caro que hay, porque el cliente compra lo que ve.
    porque: >-
      Es el bug de los pisos, el que más caro salió. La ronda 1 tenía las cuatro
      muestras dentro de un rango de 20 puntos de color y ninguna correspondía al
      producto. Se resolvió construyendo muestra y suelo desde la MISMA foto oficial
      (scripts/casablanca-pisos-compositor.py), y esta regla lo verifica en la salida.
    args:
      nombres: ["la muestra", "el piso del ambiente"]
      # ⚠️ ZONAS RE-VERIFICADAS con overlay el 28-08-2026
      # (out/_verificacion/zonas-deltae-ok.png). Las anteriores estaban MALAS: la de
      # «la muestra» caía sobre el piso y el titular, y la del «piso» sobre el bloque
      # de texto. Por eso reportaban ΔE 26,3 y 32,4 sin medir nada de lo que dicen.
      #
      # El 28-08 se eliminó la etiqueta gris (Paulina) pero la MUESTRA SE QUEDA: es la
      # previsualización del piso y sin ella el carrusel de producto no se lee
      # (Serena, 28-08). O sea que esta regla sigue teniendo objeto.
      #
      # Las fracciones valen para feed 1:1 y para feed 4:5 — la muestra arranca en el
      # 23,9 % del alto en los dos. En story NO: ahí termina en el 49 % y la zona se
      # saldría, por eso `formato: feed`.
      #
      # Medido con estas zonas: 6,5 · 13,4 · 9,7 · 17,2. El Cumarú es el que más se
      # acerca al tope, y es esperable: es una madera rojiza sobre un ambiente miel.
      # Si sube de 20, se regenera el ambiente — NO se sube el tope.
      zonas:
        - {x0: 0.135, y0: 0.270, x1: 0.225, y1: 0.540}   # dentro de la muestra
        - {x0: 0.600, y0: 0.610, x1: 0.950, y1: 0.700}   # piso limpio, sobre el texto
      delta_e_max: 20.0

  - id: desenfoque-completo
    titulo: Si se desenfoca el fondo, se desenfoca completo
    check: desenfoque_parcial
    severidad: bloqueante
    autor: Paulina Bustamante
    fecha: 2026-08-25
    cita: >-
      evita usar cuadros desenfocados. si se necesita desenfocar la imagen del fondo se
      debe desenfocar completa.
    porque: >-
      En agencia esta comprobación es sólo un aviso porque una profundidad de campo
      real la dispara. Acá sube a bloqueante: Paulina lo pidió explícitamente y en esta
      marca los fondos son ambientes completos, no planos con foco selectivo.
    args:
      bandas: 10
      razon_min: 0.026
      piso_ruido: 5.0
      min_std_banda: 4.0
