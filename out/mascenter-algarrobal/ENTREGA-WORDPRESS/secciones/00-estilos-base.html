<!-- ════════════════════════════════════════════════════════════════════════
     SECCIÓN 00 — ESTILOS BASE (VA UNA SOLA VEZ)
     ────────────────────────────────────────────────────────────────────
     Archivos que usa:
       · recursos/tipografias/poppins-light.woff2
       · recursos/tipografias/poppins-regular.woff2
       · recursos/tipografias/poppins-medium.woff2
       · recursos/tipografias/poppins-semibold.woff2
       · recursos/tipografias/poppins-bold.woff2
     Nota: Tipografía Poppins, la paleta de la marca, el contenedor de 1400 px, los
           botones, los títulos de sección y las animaciones de entrada. Sin esto,
           TODAS las secciones se ven mal.
     ════════════════════════════════════════════════════════════════════
     Va PRIMERO, antes de cualquier sección. Se pega una sola vez.
     Puede ir en un bloque «HTML personalizado» al inicio de la página,
     o en Apariencia → Personalizar → CSS adicional (sin las etiquetas <style>).
     Si el tema ya carga Poppins en los 5 pesos, se puede borrar el bloque @font-face.
     ════════════════════════════════════════════════════════════════════════ -->
<style>
/* ═══════════════════════════════════════════════════════════════
   STRIP CENTER ALGARROBAL — MÁS CENTER
   Diseño: PDF "LANDING_ALGARROBAL_CORREGIDO"
   Movimientos: calcados de pirquenogalesponiente.mascenter.cl
   ═══════════════════════════════════════════════════════════════ */

/* ── Tipografía: Poppins auto-hospedada (../recursos/tipografias/) ────────── */
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-semibold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

/* ── Paleta medida sobre el PDF y cruzada con el sitio en vivo ── */
:root{
  --rojo:#E52521;          /* rojo Más Center */
  --rojo-osc:#C81E1A;      /* hover */
  --vino:#8B1623;          /* Masterplan */
  --vino-osc:#631513;      /* bloque Accesibilidad */
  --gris:#DADADA;          /* fondo Ubicación */
  --gris-2:#D2D2D3;        /* fondo Locales */
  --claro:#F3F1F1;         /* fondo Conectividad */
  --negro:#000000;
  --negro-2:#1F1F1F;       /* barra de copyright */
  --texto:#1A1A1A;
  --texto-med:#4A4A4A;
  --texto-suave:#5F5F5F;
  --ancho:1400px;
  --radio:22px;
  --exp:cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  color:var(--texto);background:#fff;line-height:1.65;font-weight:400;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.contenedor{width:100%;max-width:var(--ancho);margin:0 auto;padding:0 clamp(20px,5vw,40px)}

/* ── ANIMACIONES ── calcadas de la referencia ─────────────────── */
.fade-up{opacity:0;transform:translateY(40px);
  transition:opacity .8s var(--exp),transform .8s var(--exp)}
.fade-up.is-visible{opacity:1;transform:translateY(0)}
.fade-left{opacity:0;transform:translateX(-50px);transition:opacity .8s ease,transform .8s ease}
.fade-right{opacity:0;transform:translateX(50px);transition:opacity .8s ease,transform .8s ease}
.fade-left.is-visible,.fade-right.is-visible{opacity:1;transform:translate(0)}
.fade-in{opacity:0;transition:opacity 1s var(--exp)}
.fade-in.is-visible{opacity:1}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}
.d3{transition-delay:.3s}.d4{transition-delay:.4s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fade-up,.fade-left,.fade-right,.fade-in{opacity:1!important;transform:none!important;transition:none!important}
  .parallax{transform:none!important}
}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:11px;padding:16px 38px;border-radius:999px;
  font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  transition:background .35s var(--exp),color .35s var(--exp),transform .35s var(--exp),box-shadow .35s var(--exp)}
.btn:hover{transform:translateY(-2px)}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-rojo:hover{background:var(--rojo-osc);box-shadow:0 10px 30px rgba(229,37,33,.34)}
.btn-vino{background:var(--vino);color:#fff}
.btn-vino:hover{background:var(--vino-osc);box-shadow:0 10px 30px rgba(139,22,35,.34)}
.btn-linea{border:1.6px solid rgba(255,255,255,.75);color:#fff}
.btn-linea:hover{background:#fff;color:var(--texto)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.titulo-seccion{font-size:clamp(2rem,4vw,3.15rem);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.subtitulo-seccion{font-size:clamp(1.1rem,2vw,1.6rem);font-weight:300;color:var(--texto-med);
  line-height:1.3;margin-top:2px}
.regla{width:46px;height:3px;background:var(--rojo);margin:26px 0 30px}
/* ══ RESPONSIVE ══════════════════════════════════════════════ */
@media (max-width:1100px){
  .accesibilidad,.conectividad,.construimos{grid-template-columns:1fr}
  .accesibilidad .bloque{border-radius:0}
  .accesibilidad .mapa{min-height:340px;order:-1}
  .construimos .foto{clip-path:none;min-height:320px}
  .construimos .texto{padding:clamp(40px,6vw,70px) clamp(20px,5vw,40px)}
  .contacto .contenedor{grid-template-columns:1fr}
  .pie .contenedor{grid-template-columns:1fr 1fr}
  .pie img.ifb{justify-self:start}
  .tarjeta-vidrio{grid-template-columns:1fr}
  .banda-datos .contenedor{justify-content:center}
}
@media (max-width:900px){
  .fade-left,.fade-right{transform:translateY(30px)}
  .fade-left.is-visible,.fade-right.is-visible{transform:translateY(0)}
  .nav{position:fixed;inset:0 0 0 auto;width:min(82vw,340px);background:rgba(0,0,0,.97);
    flex-direction:column;justify-content:center;gap:26px;transform:translateX(100%);
    transition:transform .5s var(--exp);padding:40px}
  .nav.abierto{transform:translateX(0)}
  .nav a{font-size:1rem}
  .hamburguesa{display:flex;z-index:2}
  .ubicacion .contenedor,.locales .contenedor{grid-template-columns:1fr}
  .locales .foto{order:-1}
  .dos-fotos{grid-template-columns:1fr}
  .caja-vino{grid-template-columns:1fr;margin-top:-60px}
  .caja-vino>div+div::before{display:none}
  .caja-vino>div+div{padding-top:18px;border-top:1px solid rgba(255,255,255,.3)}
  .beneficios .grilla{grid-template-columns:1fr 1fr;gap:36px 0}
  .beneficio+.beneficio::before{display:none}
  .beneficio:nth-child(odd)::after{content:'';position:absolute;right:0;top:52px;bottom:6px;width:1px;
    background:rgba(255,255,255,.22)}
  .masterplan .contenedor{grid-template-columns:1fr}
  .diapo{flex:0 0 84%}
  form.formulario{grid-template-columns:1fr}
  .hero-rojo-solido{clip-path:polygon(0 0,58% 0,44% 100%,0 100%)}
  .hero-rojo-transp{clip-path:polygon(52% 0,78% 0,64% 100%,38% 100%)}
  .hero-rojo-transp-2{display:none}
}
@media (max-width:640px){
  .pie .contenedor{grid-template-columns:1fr}
  .beneficios .grilla{grid-template-columns:1fr;gap:34px}
  .beneficio:nth-child(odd)::after{display:none}
  .diapo{flex:0 0 92%}
  .flotante a{width:46px;height:46px}
  .hero-acciones .btn{width:100%;justify-content:center}
  .cifra-flujo{gap:10px}
}
/* En móvil no se descarga el video: se muestra el poster */
@media (max-width:820px){
  .hero-media video{display:none}
  .hero-media img{display:block}
}
</style>
