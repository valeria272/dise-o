<style>
/* ── MENÚ FLOTANTE (derecha) ──────────────────────────────────── */
.flotante{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:850;
  display:flex;flex-direction:column;border-radius:8px 0 0 8px;overflow:hidden;
  box-shadow:0 6px 22px rgba(0,0,0,.24)}
.flotante a{width:52px;height:52px;display:grid;place-items:center;transition:filter .3s var(--exp)}
.flotante a:hover{filter:brightness(1.14)}
.flotante a svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.8}
.flotante .f-contacto{background:var(--rojo)}
.flotante .f-mapa{background:var(--vino)}
.flotante .f-wa{background:#25D366}
.flotante .f-wa svg{fill:#fff;stroke:none}

/* ── LIGHTBOX DEL VIDEO ───────────────────────────────────────── */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.93);
  display:none;align-items:center;justify-content:center;padding:20px;
  opacity:0;transition:opacity .4s var(--exp)}
.lightbox.abierto{display:flex}
.lightbox.visible{opacity:1}
.lightbox video{width:min(100%,1180px);max-height:86vh;border-radius:10px;background:#000}
.cerrar-lb{position:absolute;top:22px;right:26px;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.14);display:grid;place-items:center;transition:background .3s var(--exp)}
.cerrar-lb:hover{background:var(--rojo)}
.cerrar-lb svg{width:19px;height:19px;stroke:#fff;stroke-width:2.2;fill:none}

</style>

<!-- ════════════ MENÚ FLOTANTE ════════════ -->
<div class="flotante">
