<!-- ════════════════════════════════════════════════════════════════════════
     SECCIÓN 00 — ESTILOS BASE (VA UNA SOLA VEZ)
     ────────────────────────────────────────────────────────────────────
     Archivos que usa:
       · recursos/tipografias/poppins-light.woff2
       · recursos/tipografias/poppins-regular.woff2
       · recursos/tipografias/poppins-medium.woff2
       · recursos/tipografias/poppins-semibold.woff2
       · recursos/tipografias/poppins-bold.woff2
     Nota: Tipografía Poppins, la paleta de Más Center, el contenedor, los botones, los títulos de sección, las animaciones de entrada y TODO el responsive. Sin esto, las demás secciones se ven mal.
     ════════════════════════════════════════════════════════════════════
     Va PRIMERO, antes de cualquier sección. Se pega una sola vez.
     Puede ir en un bloque «HTML personalizado» al inicio de la página,
     o en Apariencia → Personalizar → CSS adicional (sin las etiquetas <style>).
     Si el tema ya carga Poppins en los 5 pesos, se puede borrar el bloque @font-face.
     ════════════════════════════════════════════════════════════════════════ -->
<style>
/* ═══════════════════════════════════════════════════════════════
   MÁS CENTER — CAPTACIÓN DE TERRENOS
   Sistema: Manual de marca Grupo IFB 2023 (Poppins · #E52521 · #65140F · #DADADA)
   Hermana de la landing Algarrobal — mismo esqueleto y mismos movimientos.
   ═══════════════════════════════════════════════════════════════ */

@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-semibold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Poppins';src:url('../recursos/tipografias/poppins-bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

:root{
  --rojo:#E52521;        /* Vivid red — manual p33 */
  --rojo-osc:#C81E1A;
  --vino:#65140F;        /* Very dark red — manual p33 */
  --gris:#DADADA;        /* Very light gray — manual p34 */
  --claro:#F3F1F1;
  --grafito:#26282C;     /* fondo oscuro de las tarjetas de proceso */
  --grafito-2:#303338;
  --negro:#000;
  --texto:#1A1A1A;
  --texto-med:#4A4A4A;
  --ancho:1400px;
  --radio:22px;
  --exp:cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  color:var(--texto);background:#fff;line-height:1.65;font-weight:400;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
.contenedor{width:100%;max-width:var(--ancho);margin:0 auto;padding:0 clamp(20px,5vw,40px)}

/* ── MOVIMIENTO ── leve, como pidió el cliente ─────────────────── */
.fade-up{opacity:0;transform:translateY(38px);transition:opacity .85s var(--exp),transform .85s var(--exp)}
.fade-up.is-visible{opacity:1;transform:translateY(0)}
.fade-left{opacity:0;transform:translateX(-46px);transition:opacity .85s var(--exp),transform .85s var(--exp)}
.fade-right{opacity:0;transform:translateX(46px);transition:opacity .85s var(--exp),transform .85s var(--exp)}
.fade-left.is-visible,.fade-right.is-visible{opacity:1;transform:translateX(0)}
.fade-in{opacity:0;transition:opacity 1.1s var(--exp)}
.fade-in.is-visible{opacity:1}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
.d4{transition-delay:.32s}.d5{transition-delay:.40s}.d6{transition-delay:.48s}.d7{transition-delay:.56s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fade-up,.fade-left,.fade-right,.fade-in{opacity:1!important;transform:none!important;transition:none!important}
  .hero-media{transform:none!important}
}

/* ── TÍTULOS DE SECCIÓN ───────────────────────────────────────── */
.eyebrow{color:var(--rojo);font-size:.78rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  display:block;margin-bottom:16px}
.eyebrow.claro{color:#fff;opacity:.8}
.titulo-seccion{font-size:clamp(1.9rem,3.9vw,3.05rem);font-weight:700;line-height:1.09;letter-spacing:-.022em}
.titulo-seccion .fina{font-weight:300;display:block}
.regla{width:46px;height:3px;background:var(--rojo);margin:26px 0 30px}
.regla.centro{margin-left:auto;margin-right:auto}

/* ── RESPONSIVE ───────────────────────────────────────────────── */
@media (max-width:1000px){
  .intro .contenedor,.contacto .contenedor{grid-template-columns:1fr}
  .pie .contenedor{grid-template-columns:1fr 1fr}
  .hero-campo{background:linear-gradient(104deg,
    var(--rojo) 0%,var(--rojo) 34%,rgba(214,33,29,.84) 48%,rgba(180,29,24,.52) 62%,
    rgba(130,23,17,.22) 76%,rgba(101,20,15,0) 90%)}
}
@media (max-width:820px){
  .nav{position:fixed;inset:0 0 auto;top:0;background:rgba(0,0,0,.97);flex-direction:column;
    justify-content:center;padding:104px 30px 44px;gap:24px;transform:translateY(-100%);
    transition:transform .5s var(--exp);height:100svh}
  .nav.abierto{transform:translateY(0)}
  .nav a{font-size:1.05rem}
  .hamburguesa{display:flex;z-index:2}
  .campos{grid-template-columns:1fr}
  .centros .cabeza{align-items:flex-start}
  .pie .contenedor{grid-template-columns:1fr}
  .flotante{right:14px;bottom:14px;padding:13px 22px;font-size:.8rem}
}
@media (max-width:560px){
  .hero-campo{opacity:.22;background:linear-gradient(180deg,var(--rojo) 0%,#C21F1B 100%)}
  .hero-rescoldo{background:linear-gradient(180deg,rgba(101,20,15,.30) 0%,rgba(101,20,15,.16) 100%)}
  .hero-velo{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.42) 34%,rgba(0,0,0,.80) 100%)}
  .hero-titulo{text-shadow:0 2px 18px rgba(0,0,0,.42)}
  .hero-bajada{text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .variable{flex-direction:column;gap:14px}
}
</style>
