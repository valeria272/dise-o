<style>
/* ── CENTROS EN OPERACIÓN ─────────────────────────────────────── */
.centros{padding:clamp(80px,10vw,140px) 0;background:#fff;overflow:hidden}
.centros .cabeza{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;
  margin-bottom:clamp(38px,4vw,58px);flex-wrap:wrap}
.centros .cabeza p{color:var(--texto-med);max-width:44ch;margin-top:12px}
.flechas{display:flex;gap:12px;flex-shrink:0}
.flecha{width:52px;height:52px;border-radius:50%;border:1.6px solid rgba(0,0,0,.16);
  display:grid;place-items:center;transition:background .35s var(--exp),border-color .35s var(--exp),transform .35s var(--exp)}
.flecha svg{width:17px;height:17px;stroke:var(--texto);stroke-width:2;fill:none;transition:stroke .35s}
.flecha:hover{background:var(--rojo);border-color:var(--rojo);transform:scale(1.06)}
.flecha:hover svg{stroke:#fff}
.pista-envoltorio{overflow:hidden;margin:0 calc(-1 * clamp(20px,5vw,40px));padding:0 clamp(20px,5vw,40px)}
.pista{display:flex;gap:clamp(16px,2vw,24px);transition:transform .75s var(--exp)}
.centro{flex:0 0 clamp(260px,30vw,392px);border-radius:var(--radio);overflow:hidden;position:relative;
  transition:transform .5s var(--exp)}
.centro img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform 1.1s var(--exp)}
.centro:hover img{transform:scale(1.06)}
.centro::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 46%,rgba(0,0,0,.72) 100%)}
.centro .rotulo{position:absolute;left:22px;bottom:20px;z-index:2;color:#fff}
.centro .rotulo .n{font-size:1.05rem;font-weight:600;line-height:1.25}
.centro .rotulo .c{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin-top:2px}
.puntos{display:flex;gap:8px;justify-content:center;margin-top:36px}
.punto{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);transition:all .4s var(--exp)}
.punto.activo{background:var(--rojo);width:26px;border-radius:999px}
</style>
