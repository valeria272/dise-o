<!-- ════════════════════════════════════════════════════════════════════════
     SECCIÓN 99 — SCRIPTS (VA UNA SOLA VEZ, AL FINAL)
     ────────────────────────────────────────────────────────────────────
     Nota: Hace funcionar: las apariciones al hacer scroll, la cabecera que se oscurece, el menú de celular, el parallax de la portada, los contadores, el carrusel de centros y la validación del formulario.
     ════════════════════════════════════════════════════════════════════
     Va ÚLTIMO, después de todas las secciones, en su propio bloque «HTML personalizado».
     Se pega una sola vez. No usa jQuery ni ninguna librería externa.
     ════════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  var suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Aparición al hacer scroll ── */
  var obs = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('is-visible'); obs.unobserve(e.target); }
    });
  },{threshold:.12,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.fade-up,.fade-left,.fade-right,.fade-in,.cifra').forEach(function(el){obs.observe(el);});

  /* ── Contadores ── */
  function animarContador(el){
    var fin = parseInt(el.dataset.a,10), sep = el.dataset.sep === '1';
    if(!suave){ el.textContent = sep ? fin.toLocaleString('es-CL') : fin; return; }
    var t0 = null, dur = 1600;
    function paso(t){
      if(!t0) t0 = t;
      var p = Math.min((t-t0)/dur,1);
      var v = Math.round(fin * (1 - Math.pow(1-p,3)));
      el.textContent = sep ? v.toLocaleString('es-CL') : v;
      if(p < 1) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }
  var obsN = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ animarContador(e.target); obsN.unobserve(e.target); } });
  },{threshold:.5});
  document.querySelectorAll('.contador').forEach(function(el){obsN.observe(el);});

  /* ── Cabecera sólida + botón flotante ── */
  var cab = document.getElementById('cabecera'), flo = document.getElementById('flotante');
  var hero = document.getElementById('inicio'), media = document.getElementById('hero-media');
  var tic = false;
  function alScroll(){
    var y = window.scrollY;
    cab.classList.toggle('solido', y > 60);
    flo.classList.toggle('visible', y > window.innerHeight * .85);
    /* Parallax leve del hero */
    if(suave && y < window.innerHeight * 1.2){
      media.style.transform = 'translateY(' + (y * .16) + 'px)';
    }
    tic = false;
  }
  window.addEventListener('scroll', function(){
    if(!tic){ requestAnimationFrame(alScroll); tic = true; }
  }, {passive:true});
  alScroll();

  /* ── Menú móvil ── */
  var ham = document.getElementById('hamburguesa'), nav = document.getElementById('nav');
  ham.addEventListener('click', function(){
    var abierto = nav.classList.toggle('abierto');
    ham.classList.toggle('abierto', abierto);
    ham.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    document.body.style.overflow = abierto ? 'hidden' : '';
  });
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      nav.classList.remove('abierto'); ham.classList.remove('abierto');
      ham.setAttribute('aria-expanded','false'); document.body.style.overflow = '';
    });
  });

  /* ── Carrusel de centros ── */
  var pista = document.getElementById('pista');
  var tarjetas = Array.prototype.slice.call(pista.children);
  var puntos = document.getElementById('puntos');
  var idx = 0;

  function porVista(){
    var w = pista.parentElement.clientWidth;
    var tw = tarjetas[0].getBoundingClientRect().width + 24;
    return Math.max(1, Math.floor(w / tw));
  }
  function maxIdx(){ return Math.max(0, tarjetas.length - porVista()); }

  function pintarPuntos(){
    puntos.innerHTML = '';
    for(var i = 0; i <= maxIdx(); i++){
      var p = document.createElement('button');
      p.className = 'punto' + (i === idx ? ' activo' : '');
      p.setAttribute('aria-label','Ir al centro ' + (i+1));
      (function(n){ p.addEventListener('click', function(){ idx = n; mover(); }); })(i);
      puntos.appendChild(p);
    }
  }
  function mover(){
    idx = Math.max(0, Math.min(idx, maxIdx()));
    var tw = tarjetas[0].getBoundingClientRect().width + 24;
    pista.style.transform = 'translateX(' + (-idx * tw) + 'px)';
    Array.prototype.forEach.call(puntos.children, function(p, i){
      p.classList.toggle('activo', i === idx);
    });
  }
  document.getElementById('sig').addEventListener('click', function(){
    idx = idx >= maxIdx() ? 0 : idx + 1; mover();
  });
  document.getElementById('ant').addEventListener('click', function(){
    idx = idx <= 0 ? maxIdx() : idx - 1; mover();
  });

  /* Arrastre táctil */
  var x0 = null;
  pista.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  pista.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var d = x0 - e.changedTouches[0].clientX;
    if(Math.abs(d) > 45){ idx += d > 0 ? 1 : -1; mover(); }
    x0 = null;
  }, {passive:true});

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ pintarPuntos(); mover(); }, 160);
  });
  pintarPuntos(); mover();

  /* ── Formulario ──
     Sin backend: arma la postulación y la abre en el correo del visitante, ya
     dirigida al buzón de captación. Cuando la landing se monte en WordPress con
     Contact Form 7, este bloque se reemplaza por el envío real — mismo
     destinatario. Ver NOTAS-DE-ENTREGA.md, sección "Formulario". */
  var BUZON = 'terrenos@ifbinversiones.cl';
  var TOPE_MB = 10, TIPOS = ['pdf','jpg','jpeg','png','kmz','kml','dwg','zip'];
  var form = document.getElementById('formulario'), aviso = document.getElementById('aviso');
  var archivos = document.getElementById('archivos'),
      cajaArch = document.getElementById('caja-archivos'),
      listaArch = document.getElementById('lista-archivos');

  function pesoLegible(b){
    return b >= 1048576 ? (b/1048576).toFixed(1).replace('.', ',') + ' MB'
                        : Math.max(1, Math.round(b/1024)) + ' KB';
  }
  function elegidos(){ return archivos && archivos.files ? Array.prototype.slice.call(archivos.files) : []; }
  function revisarArchivos(){
    var fs = elegidos(), total = 0, malos = [];
    fs.forEach(function(f){
      total += f.size;
      var ext = f.name.split('.').pop().toLowerCase();
      if(TIPOS.indexOf(ext) === -1) malos.push(f.name);
    });
    if(malos.length) return {error: 'Estos archivos no se pueden adjuntar: ' + malos.join(', ') +
      '. Acepta PDF, JPG, PNG, KMZ, KML, DWG y ZIP.'};
    if(total > TOPE_MB * 1048576) return {error: 'Los archivos suman ' + pesoLegible(total) +
      ' y el tope es ' + TOPE_MB + ' MB. Manda los más pesados aparte a ' + BUZON + '.'};
    return {ok: true, archivos: fs};
  }
  function pintarArchivos(){
    var fs = elegidos();
    listaArch.innerHTML = '';
    listaArch.classList.toggle('visible', fs.length > 0);
    fs.forEach(function(f){
      var li = document.createElement('li');
      li.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 7V3.5L19.5 9H14z"/></svg>' +
        '<span></span><span class="peso">' + pesoLegible(f.size) + '</span>';
      li.querySelector('span').textContent = f.name;
      listaArch.appendChild(li);
    });
  }
  if(archivos){
    archivos.addEventListener('change', function(){
      cajaArch.classList.remove('error');
      pintarArchivos();
      var r = revisarArchivos();
      if(r.error){
        cajaArch.classList.add('error');
        aviso.className = 'aviso-form mal';
        aviso.textContent = r.error;
      }else if(aviso.classList.contains('mal')){
        aviso.className = 'aviso-form'; aviso.textContent = '';
      }
    });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var malos = [];
    form.querySelectorAll('[required]').forEach(function(c){
      var vacio = !c.value.trim();
      var correoMal = c.type === 'email' && c.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.value);
      c.classList.toggle('error', vacio || correoMal);
      if(vacio || correoMal) malos.push(c);
    });
    if(malos.length){
      aviso.className = 'aviso-form mal';
      aviso.textContent = 'Revisa los campos marcados: falta completar ' + malos.length +
        (malos.length === 1 ? ' dato.' : ' datos.');
      malos[0].focus();
      return;
    }
    var rev = revisarArchivos();
    if(rev.error){
      cajaArch.classList.add('error');
      aviso.className = 'aviso-form mal';
      aviso.textContent = rev.error;
      archivos.focus();
      return;
    }
    var v = function(id){ return document.getElementById(id).value.trim(); };
    var asunto = 'Postulación de terreno — ' + v('comuna') + ', ' + v('region');
    var cuerpo = [
      'Nueva postulación de terreno desde la landing de Más Center.',
      '',
      'Nombre y apellido: ' + v('nombre'),
      'Correo electrónico: ' + v('email'),
      'Teléfono: ' + v('telefono'),
      '',
      'Región: ' + v('region'),
      'Comuna: ' + v('comuna'),
      'Superficie: ' + v('superficie') + ' m2',
      'Dirección o rol: ' + v('direccion'),
      '',
      'Sobre el terreno:',
      v('mensaje')
    ];
    var adj = rev.archivos || [];
    if(adj.length){
      cuerpo.push('', 'Archivos que el postulante adjunta a este mismo correo:');
      adj.forEach(function(f){ cuerpo.push('  - ' + f.name + ' (' + pesoLegible(f.size) + ')'); });
    }
    cuerpo = cuerpo.join('\r\n');
    window.location.href = 'mailto:' + BUZON +
      '?subject=' + encodeURIComponent(asunto) +
      '&body=' + encodeURIComponent(cuerpo);
    aviso.className = 'aviso-form ok';
    aviso.textContent = 'Te abrimos el correo con la postulación lista para enviar a ' + BUZON +
      (adj.length ? '. Adjunta ahí ' + (adj.length === 1 ? 'el archivo que elegiste (' + adj[0].name + ')'
                                                        : 'los ' + adj.length + ' archivos que elegiste') +
                    ' y dale enviar.'
                  : '. Revísala y dale enviar.') +
      ' Si no se abrió tu programa de correo, escríbenos directamente a ' + BUZON +
      ' y cuéntanos sobre tu terreno.';
  });
  form.querySelectorAll('input,select,textarea').forEach(function(c){
    c.addEventListener('input', function(){ c.classList.remove('error'); });
  });

  document.getElementById('anio').textContent = new Date().getFullYear();
})();
</script>
